name: Release / ReMe Python package

# Publishing a GitHub Release is the primary release trigger for reme-ai; workflow_dispatch is the recovery path.
# Manual runs publish the version in reme/__init__.py from the selected ref.
# Configure a PyPI Trusted Publisher for this repository, workflow, and its pypi environment first.

run-name: Publish reme-ai ${{ github.event.release.tag_name || github.ref_name }}

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-reme-ai
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify distributions
    uses: ./.github/workflows/_build-python-packages.yml
    with:
      expected_version: ${{ github.event.release.tag_name }}
      upload_artifacts: true

  validate-publish-target:
    name: Validate publication target
    if: >-
      vars.FERMES_ENABLE_PUBLISHING == 'true' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'release' && github.event.release.target_commitish == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the publication commit is on main
        env:
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          # GITHUB_SHA is the tagged commit for published release events and the selected commit for dispatch.
          target_commit="$WORKFLOW_SHA"
          git merge-base --is-ancestor "$target_commit" refs/remotes/origin/main

  publish-reme:
    if: >-
      vars.FERMES_ENABLE_PUBLISHING == 'true' &&
      needs.build.result == 'success' &&
      needs.validate-publish-target.result == 'success' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'release' && github.event.release.target_commitish == 'main'))
    needs: [build, validate-publish-target]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download ReMe distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: reme-distributions
          path: dist/reme

      - name: Publish ReMe
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/reme
          skip-existing: true
